i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO5
    i2s_mclk_pin: GPIO0

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO17
    dac_type: external
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 500ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: box_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
      - id: media_mixer_input

  - platform: resampler
    id: media_resampling_input
    output_speaker: media_mixer_input
    sample_rate: 48000

  - platform: resampler
    id: announcement_resampling_input
    output_speaker: announcement_mixer_input    
    sample_rate: 48000

sendspin:
  id: sendspin_hub

audio_file:
  - id: ready_sound
    file: ${startup_sound_file}

media_source:
  - platform: sendspin
    id: sendspin_source
    buffer_size: 2000000
  - platform: audio_file
    id: file_source

media_player:
  - platform: sendspin
    id: sendspin_media_player
    name: Raspiaudio Radio Music
    volume_increment: 2%
    on_state:
      then:
        - lambda: |-
            const float volume = id(sendspin_media_player).volume;
            if (volume == volume) id(Vol) = volume;
        - script.execute: apply_codec_volume
  - platform: speaker_source
    name: Radio Audio
    id: external_media_player
    internal: true

    announcement_pipeline:
      speaker: announcement_resampling_input
      sources:
        - file_source
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_input
      sources:
        - sendspin_source
      format: FLAC
      num_channels: 2      
      sample_rate: 48000

    volume_increment: 0.05
    volume_min: 0.0
    volume_max: 1.0
    on_state:
      then:
        - lambda: |-
            using media_player::MediaPlayerState;
            auto state = id(external_media_player).state;
            if (
              state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
              state == MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING
            ) {
              id(led_green).execute();
            } else {
              id(led_red).execute();
            }
            
            
sensor:
  - platform: sendspin
    id: ma_media_duration
    type: track_duration
    internal: true
  - platform: adc
    id: button_adc
    pin: GPIO1
    attenuation: auto
    update_interval: .1s
    on_value_range:
      - above: 3.0
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: OFF
          - binary_sensor.template.publish:
              id: btn_1
              state: OFF
          - binary_sensor.template.publish:
              id: btn_2
              state: OFF
          - binary_sensor.template.publish:
              id: btn_3
              state: OFF
      - above: 0.41
        below: 0.45
        then:
          - binary_sensor.template.publish:
              id: btn_3
              state: ON
      - above: 0.8
        below: 0.84
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: ON
      - above: 1.50
        below: 1.61
        then:
          - binary_sensor.template.publish:
              id: btn_1
              state: ON
      - above: 1.98
        below: 2.03
        then:
          - binary_sensor.template.publish:
              id: btn_2
              state: ON
  - platform: adc
    pin: GPIO13
    name: Battery voltage
    id: battery_voltage
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    attenuation: auto
    filters:
      - multiply: 2
      - calibrate_linear:
          - 0.0 -> 0.0
          - 4.58 -> 4.20
      - exponential_moving_average:
          alpha: 0.2
          send_every: 2
      - delta: 0.002
    on_value:
      then:
        - sensor.template.publish:
            id: battery_percent
            state: !lambda "return x;"
  - platform: template
    name: Battery
    id: battery_percent
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    filters:
      - calibrate_polynomial:
          degree: 3
          datapoints:
            - 4.20 -> 100.0
            - 4.13 -> 97.1
            - 4.10 -> 94.2
            - 4.07 -> 88.4
            - 4.05 -> 82.7
            - 4.04 -> 76.9
            - 4.04 -> 71.1
            - 4.01 -> 65.3
            - 3.99 -> 59.5
            - 3.95 -> 53.8
            - 3.93 -> 48.0
            - 3.91 -> 42.2
            - 3.88 -> 36.4
            - 3.86 -> 30.6
            - 3.84 -> 24.9
            - 3.82 -> 19.1
            - 3.76 -> 13.3
            - 3.73 -> 10.4
            - 3.70 -> 7.5
            - 3.64 -> 4.6
            - 3.50 -> 1.7
            - 3.00 -> 0.0
      - lambda: return clamp(x, 0.0f, 100.0f);
  - platform: rotary_encoder
    name: "Volume"
    id: volume_encoder
    pin_a:
      number: GPIO42
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO3
      mode:
        input: true
        pullup: true
    on_anticlockwise:
      then:
        - script.execute:
            id: adjust_volume
            delta: -0.05
    on_clockwise:
      then:
        - script.execute:
            id: adjust_volume
            delta: 0.05
script:
  - id: apply_codec_volume
    then:
      - lambda: |-
          int reg = 33;
          int v = int(id(Vol) * 10.0f + 0.5f);
          if (id(Vol) < 0.1f) {
            reg = 23 + v;
          }
          id(my_es8388).write_byte(46, reg);
          id(my_es8388).write_byte(47, reg);
          id(my_es8388).write_byte(48, reg);
          id(my_es8388).write_byte(49, reg);
  - id: adjust_volume
    mode: single
    parameters:
      delta: float
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - lambda: |-
          float scale = 1.0f;
          if (id(Vol) < 0.03f) scale = 0.05f;
          else if (id(Vol) < 0.10f) scale = 0.40f;
          else if (id(Vol) < 0.30f) scale = 0.50f;
          else if (id(Vol) < 0.50f) scale = 0.60f;

          id(Vol) += delta * scale;
          if (id(Vol) < 0.0f) id(Vol) = 0.0f;
          if (id(Vol) > 1.0f) id(Vol) = 1.0f;
          id(mute) = false;
      - script.execute: apply_codec_volume
      - media_player.volume_set:
          id: sendspin_media_player
          volume: !lambda "return id(Vol);"
  - id: play_radio_preset
    mode: restart
    parameters:
      station: string
    then:
      - if:
          condition:
            lambda: return station.find_first_not_of(" \t\r\n") != std::string::npos;
          then:
            # L'entité MA détectée lors de la première mémorisation est réutilisée.
            # À défaut, HA cherche le lecteur MA dont le nom contient "radio".
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: radio
                  enqueue: replace
                data_template:
                  entity_id: >-
                    {% set configured = player_entity | trim %}
                    {% if configured and states(configured) not in ['unknown', 'unavailable']
                          and state_attr(configured, 'mass_player_type') is not none %}
                      {{ configured }}
                    {% else %}
                      {% set ns = namespace(entity_id='') %}
                      {% for player in states.media_player %}
                        {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                        {% if ns.entity_id == '' and player.attributes.mass_player_type is defined
                              and 'radio' in label %}
                          {% set ns.entity_id = player.entity_id %}
                        {% endif %}
                      {% endfor %}
                      {{ ns.entity_id }}
                    {% endif %}
                  media_content_id: "{{ station_name }}"
                variables:
                  station_name: !lambda return station;
                  player_entity: !lambda return id(ma_player_entity_id);
          else:
            - logger.log:
                level: WARN
                format: "Bouton radio ignoré : aucune station configurée"
  - id: save_radio_preset
    mode: restart
    parameters:
      preset: int
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      # music_assistant.get_queue est une action de lecture seule. Sa réponse contient
      # l'URI exacte de l'élément en cours et la véritable entité MA ciblée.
      - homeassistant.action:
          action: music_assistant.get_queue
          data_template:
            entity_id: >-
              {% set configured = player_entity | trim %}
              {% if configured and states(configured) not in ['unknown', 'unavailable']
                    and state_attr(configured, 'mass_player_type') is not none %}
                {{ configured }}
              {% else %}
                {% set ns = namespace(metadata='', named='') %}
                {% for player in states.media_player %}
                  {% if player.attributes.mass_player_type is defined
                        and player.state not in ['unknown', 'unavailable'] %}
                    {% set same_album = current_album | length > 0
                          and player.attributes.media_album_name | default('') == current_album %}
                    {% set same_title = current_title | length > 0
                          and player.attributes.media_title | default('') == current_title %}
                    {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                    {% if ns.metadata == '' and (same_album or same_title) %}
                      {% set ns.metadata = player.entity_id %}
                    {% endif %}
                    {% if ns.named == '' and 'radio' in label %}
                      {% set ns.named = player.entity_id %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.metadata if ns.metadata else ns.named }}
              {% endif %}
          variables:
            player_entity: !lambda return id(ma_player_entity_id);
            current_title: !lambda return id(ma_media_title).state;
            current_album: !lambda return id(ma_media_album_name).state;
          capture_response: true
          response_template: >-
            {% set entity_id = response.keys() | list | first | default('') %}{% set item = response[entity_id].get('current_item') if entity_id else none %}{% set media_item = item.get('media_item') if item else none %}{% set uri = state_attr(entity_id, 'media_content_id') or (media_item.get('uri', '') if media_item else '') %}{{ entity_id }}|@|{{ uri }}
          on_success:
            - lambda: |-
                const std::string payload = response["response"].as<std::string>();
                const size_t separator = payload.find("|@|");
                const std::string entity_id = separator == std::string::npos
                    ? "" : payload.substr(0, separator);
                const std::string uri = separator == std::string::npos
                    ? "" : payload.substr(separator + 3);
                const bool valid = !entity_id.empty() && !uri.empty() &&
                                   uri.find("://") != std::string::npos;
                if (!valid) {
                  id(preset_message) = "AUCUNE RADIO";
                  id(preset_message_until_ms) = millis() + 2500;
                  ESP_LOGW("radio_preset", "Réponse MA sans station exploitable: %s", payload.c_str());
                  return;
                }

                text::Text *target = nullptr;
                if (preset == 1) target = id(radio_station_1);
                else if (preset == 2) target = id(radio_station_2);
                else if (preset == 3) target = id(radio_station_3);
                else if (preset == 4) target = id(radio_station_4);
                if (target == nullptr) return;

                id(ma_player_entity_id) = entity_id;
                auto call = target->make_call();
                call.set_value(uri);
                call.perform();
                id(preset_message) = "MEMO " + std::to_string(preset) + " OK";
                id(preset_message_until_ms) = millis() + 2500;
                ESP_LOGW("radio_preset", "Station mémorisée sur le bouton %d via %s",
                         preset, entity_id.c_str());
          on_error:
            - lambda: |-
                id(preset_message) = "AUCUNE RADIO";
                id(preset_message_until_ms) = millis() + 2500;
                ESP_LOGW("radio_preset", "Lecture de la file MA impossible: %s", error.c_str());
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
  - id: led_red
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 40%

  - id: led_green
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%

switch:
  - platform: template
    id: startup_sound_switch
    name: Startup sound
    icon: "mdi:card-text-outline"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

globals:
  - id: startup_logo_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: boot_sound_played
    type: bool
    restore_value: no
    initial_value: "false"
  - id: preset_message_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: preset_message
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ma_player_entity_id
    type: std::string
    restore_value: yes
    max_restore_data_length: 96
    initial_value: '"${music_assistant_player_entity}"'
  - id: Vol
    type: float
    initial_value: '0.6'    
    restore_value: true
  - id: phase
    type: int
    initial_value: '0'    
  - id: mute  
    type: bool
    initial_value: 'false'  

interval:
  - interval: 750ms
    then:
      - component.update: my_display

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO48
      inverted: true
      mode:
        input: true
        pullup: true
    name: Button
    on_press:
      then:
        - light.turn_on:
            id: screen_backlight
            brightness: 100%
        - media_player.toggle: sendspin_media_player
  - platform: template
    name: "Radio 4"
    id: btn_confirm
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: play_radio_preset
              station: !lambda return id(radio_station_4).state;
      - min_length: 1800ms
        max_length: 8s
        then:
          - script.execute:
              id: save_radio_preset
              preset: 4
  - platform: template
    name: "Radio 1"
    id: btn_1
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: play_radio_preset
              station: !lambda return id(radio_station_1).state;
      - min_length: 1800ms
        max_length: 8s
        then:
          - script.execute:
              id: save_radio_preset
              preset: 1
  - platform: template
    name: "Radio 2"
    id: btn_2
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: play_radio_preset
              station: !lambda return id(radio_station_2).state;
      - min_length: 1800ms
        max_length: 8s
        then:
          - script.execute:
              id: save_radio_preset
              preset: 2
  - platform: template
    name: "Radio 3"
    id: btn_3
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: play_radio_preset
              station: !lambda return id(radio_station_3).state;
      - min_length: 1800ms
        max_length: 8s
        then:
          - script.execute:
              id: save_radio_preset
              preset: 3

output:
  - platform: gpio
    id: dac_mute
    pin:
      number: GPIO46
      inverted: true
      mode:
        output: true
      ignore_strapping_warning: true
  - platform: ledc
    id: screen_backlight_pin
    pin:
      number: GPIO41
      mode:
        output: true

light:
