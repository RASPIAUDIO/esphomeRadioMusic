substitutions:
    startup_sound_file: "https://raw.githubusercontent.com/RASPIAUDIO/esphomeRadioMusic/main/sounds/sounds_timer_finished.wav"
    # Ancien identifiant conservé uniquement comme premier indice. Le firmware
    # détecte désormais automatiquement l'entité Music Assistant réellement liée.
    music_assistant_player_entity: media_player.raspiaudio_radio_music_3
    startup_logo_file: "https://raw.githubusercontent.com/RASPIAUDIO/esphomeRadioMusic/main/images/Raspiaudio.png"
esphome:
  name: radio-music
  friendly_name: Raspiaudio Radio Music
  min_version: 2026.8.0
  name_add_mac_suffix: false
  
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(startup_logo_until_ms) = millis() + 5000;
      - output.turn_off: dac_mute
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - script.execute: led_red
      - script.execute: apply_codec_volume
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: media
          delay: 1500ms
      
  project:
    name: raspiaudio.radio-music-assistant
    version: "2026.8.7"
    
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
    advanced:
      include_builtin_idf_components:
        - esp_http_client
logger:
  level: warn

api:
  # Sendspin continue de fonctionner même sans client Home Assistant.
  reboot_timeout: 0s
  on_client_connected:
    - if:
        condition:
          lambda: return !id(boot_sound_played);
        then:
          - lambda: id(boot_sound_played) = true;
          - delay: 5s
          - if:
              condition:
                lambda: |-
                  using media_player::MediaPlayerState;
                  return id(startup_sound_switch).state &&
                    id(external_media_player).state != MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING &&
                    id(external_media_player).state != MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING;
              then:
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: ready_sound
        
